<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Admin · Theo sản phẩm · 390px</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; min-height: 2500px; box-sizing: border-box; overflow: hidden; font-family: 'Be Vietnam Pro', system-ui, sans-serif; background: {{bg}}">
<dc-import name="AdminProgramProducts" theme="{{theme}}" hint-size="390px,2500px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":2500}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme === 'light' ? 'light' : 'dark';
    return {theme, bg: theme === 'light' ? '#F7F6F4' : '#121110'};
  }
}
</script>
</body>
</html>
